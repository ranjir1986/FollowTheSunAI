<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Operations Dashboard</title>
    <style>
        /* Professional Dark Mode CSS */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #ffffff; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #4CAF50; margin-bottom: 5px; }
        
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background-color: #2b2b36; padding: 20px; border-radius: 8px; text-align: center; border-top: 4px solid #4CAF50; }
        .card h3 { margin: 0; font-size: 14px; color: #a0a0b0; text-transform: uppercase; }
        .card p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; background-color: #2b2b36; border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #3b3b4a; }
        th { background-color: #3b3b4a; color: #a0a0b0; }
        
        .risk-CRITICAL { color: #ff4d4d; font-weight: bold; }
        .risk-HIGH { color: #ffa64d; font-weight: bold; }
        .risk-NORMAL { color: #4CAF50; }
        
        .summary-box { background-color: #2b2b36; padding: 20px; border-radius: 8px; border-left: 4px solid #4CAF50; font-family: monospace; white-space: pre-wrap; line-height: 1.5; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI-Powered Global Support Operations</h1>
        <p>Follow The Sun Routing & Risk Analysis</p>
    </div>

    <!-- AI Ticket Form -->
    <div class="card" style="text-align: left; margin-bottom: 30px;">
        <h3>Submit a Live Ticket to the AI</h3>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="ticketInput" placeholder="e.g., My VPN keeps dropping from the Germany office..." style="flex: 1; padding: 10px; background: #1e1e24; color: white; border: 1px solid #4CAF50; border-radius: 5px; font-size: 16px;">
            <button onclick="submitAITicket()" style="margin-bottom: 0;">Analyze with AI</button>
        </div>
    </div>

    <!-- AI Result Box (Hidden by default) -->
    <div id="ai-result" class="summary-box" style="display: none; border-left-color: #ffa64d; margin-bottom: 30px;"></div>

    <button onclick="loadDashboard()">Refresh Dashboard Data</button>

    <div class="metrics-grid" id="metrics">
        <!-- Metrics will appear here -->
    </div>

    <table>
        <thead>
            <tr>
                <th>Ticket ID</th>
                <th>Issue</th>
                <th>Priority</th>
                <th>Region</th>
                <th>Routed Center</th>
                <th>Escalation Risk</th>
            </tr>
        </thead>
        <tbody id="ticket-table">
            <!-- Rows will appear here -->
        </tbody>
    </table>

    <h2>Executive Summary</h2>
    <div class="summary-box" id="summary">
        Loading summary...
    </div>

    <script>
        // --- 1. Load Initial Dashboard Data ---
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const data = await response.json();

                // Update Metrics
                document.getElementById('metrics').innerHTML = `
                    <div class="card"><h3>Total Tickets</h3><p>${data.metrics.totalTickets}</p></div>
                    <div class="card" style="border-top-color: #ff4d4d;"><h3>Escalations</h3><p>${data.metrics.escalations}</p></div>
                    <div class="card"><h3>Agents Needed</h3><p>${data.metrics.agentsRequired}</p></div>
                    <div class="card"><h3>Simulated CSAT</h3><p>${data.metrics.csat}%</p></div>
                `;

                // Update Table
                const tableBody = document.getElementById('ticket-table');
                tableBody.innerHTML = ''; 
                
                data.tickets.forEach(ticket => {
                    const row = `
                        <tr>
                            <td>${ticket.ticketId}</td>
                            <td>${ticket.title}</td>
                            <td>${ticket.priority}</td>
                            <td>${ticket.region}</td>
                            <td>${ticket.assignedCenter}</td>
                            <td class="risk-${ticket.risk}">${ticket.risk}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

                // Update Summary
                document.getElementById('summary').innerText = data.summary;

            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('summary').innerText = "Error loading data. Make sure the server is running!";
            }
        }

        // --- 2. Submit New Ticket to AI ---
        async function submitAITicket() {
            const text = document.getElementById('ticketInput').value;
            if(!text) return alert("Please enter a ticket first!");

            const resultBox = document.getElementById('ai-result');
            resultBox.style.display = 'block';
            resultBox.innerHTML = "🤖 <b>AI is thinking (and checking multiple models)... Please wait.</b>";

            try {
                // Send the ticket text to our new backend route
                const response = await fetch('/api/analyze-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticketText: text, region: "EMEA" })
                });
                
                const data = await response.json();

                // Display the result beautifully
                resultBox.innerHTML = `
                    <strong>✅ AI Analysis Complete!</strong><br><br>
                    <b>Category:</b> ${data.ticket.category}<br>
                    <b>Priority:</b> ${data.ticket.priority}<br>
                    <b>Team:</b> ${data.ticket.assignedTeam}<br>
                    <b>Routed Center:</b> ${data.assignedCenter}<br>
                    <b>Risk Level:</b> <span class="risk-${data.risk}">${data.risk}</span><br>
                    <b>AI Model Used:</b> ${data.ticket.aiModelUsed}
                `;
                
                // Clear the input box for the next test
                document.getElementById('ticketInput').value = '';
                
            } catch (error) {
                resultBox.innerHTML = "❌ Error: Could not process ticket. Check your server terminal.";
            }
        }

        // Load data as soon as the page opens
        loadDashboard();
    </script>
</body>
</html>
